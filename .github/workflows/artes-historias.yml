# Dibuja el PNG de cada tarjeta de historias que cambie, y lo deja en la rama.
#
# Para qué: un agente puede escribir una tarjeta y empujarla, pero no puede
# abrir el generador y apretar el botón de exportar. Sin esto entrega código;
# con esto entrega el arte, y puede dar un enlace que se abre y se baja.
#
# Solo dibuja lo que cambió en ese empujón, no las 21. Cada pieza pesa medio
# mega y van al repo, así que redibujar todo cada vez lo engordaría sin razón.

name: Artes de historias

on:
  push:
    paths:
      - "public/windmar-pr-stories-v2-preview.html"
      # Los carruseles entran por aquí desde el 27 de octubre. Si se añade otro
      # generador, va en esta lista Y en GENERADORES de render-carruseles.mjs:
      # en una sola se dibuja sin dispararse, o se dispara sin dibujarse.
      - "public/windmar-carruseles-pr.html"

  # A mano, desde la pestaña Actions. Hace falta para arrancar: el disparador
  # de arriba solo mira el generador, así que arreglar el workflow no basta
  # para que se dibuje nada. Con esto se pueden sacar las 22 de una vez sin
  # tener que tocar el HTML a propósito para provocar una corrida.
  workflow_dispatch:
    inputs:
      todas:
        description: "Dibujar las 22, no solo las que cambiaron"
        type: boolean
        default: true

permissions:
  contents: write

# Si llegan dos empujones seguidos a la misma rama, que gane el último.
concurrency:
  group: artes-historias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta dos commits para poder comparar con la versión anterior
          # y saber qué tarjeta cambió.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar lo justo
        # Solo puppeteer-core. Un `npm ci` traería Next y todo lo demás para
        # nada: este script no construye la app, solo abre una página.
        run: npm install --no-save --no-audit --no-fund puppeteer-core@^25.5.0

      - name: Pillow para el aplanado
        # render-stories.mjs llama a python3 con `from PIL import Image` para
        # hacer la copia «-vista» sobre el fondo de marca. En la Mac Pillow ya
        # está, pero el runner no lo trae y el workflow nunca lo instalaba: la
        # tarjeta se contaba como fallida y el paso entero moría.
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Comprobar el entorno antes de dibujar
        # Las corridas fallan en el paso «Dibujar» sin dejar rastro de por qué,
        # y los logs no se pueden leer sin permisos de admin. Esto imprime las
        # dos dependencias que el script da por sentadas, para que el log diga
        # cuál falta en vez de haber que adivinarlo.
        run: |
          echo "node        $(node -v)"
          python3 -c 'import PIL; print("Pillow     ", PIL.__version__)'
          if [ -x "${CHROME_PATH:-/usr/bin/google-chrome}" ]; then
            echo "Chrome      ${CHROME_PATH:-/usr/bin/google-chrome}"
          else
            echo "Chrome      NO ESTÁ en ${CHROME_PATH:-/usr/bin/google-chrome}"
            exit 1
          fi
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Sacar la versión con qué comparar
        id: anterior
        run: |
          ARCHIVO=public/windmar-pr-stories-v2-preview.html

          # Corrida a mano pidiendo todas: sin versión con qué comparar, que es
          # como el script entiende «dibújalas todas».
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.todas }}" = "true" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # En una rama se compara contra main, no contra el commit anterior de
          # la propia rama. Lo que tiene que dibujarse es lo que la rama APORTA.
          #
          # Comparar contra el commit anterior parece lo natural, pero se rompe
          # en cuanto una corrida falla o no llega a dispararse: el siguiente
          # empujón ve que «nada cambió desde el commit de antes» y la pieza no
          # se dibuja nunca. Contra main siempre se puede recuperar.
          if [ "${{ github.ref_name }}" != "main" ]; then
            git fetch -q --depth=1 origin main 2>/dev/null || true
            if git cat-file -e "origin/main:$ARCHIVO" 2>/dev/null; then
              git show "origin/main:$ARCHIVO" > /tmp/anterior.html
              echo "hay=si" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # En main sí es el commit anterior: ahí no hay «aporte de rama».
          if git cat-file -e "${{ github.event.before }}:$ARCHIVO" 2>/dev/null; then
            git show "${{ github.event.before }}:$ARCHIVO" > /tmp/anterior.html
            echo "hay=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sin nada con qué comparar: solo entonces se dibuja todo.
          echo "hay=no" >> "$GITHUB_OUTPUT"

      - name: Dibujar
        id: dibujar
        env:
          # Los runners de GitHub traen Chrome instalado aquí.
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ "${{ steps.anterior.outputs.hay }}" = "si" ]; then
            node scripts/render-stories.mjs --cambiadas /tmp/anterior.html
          else
            node scripts/render-stories.mjs
          fi

      # Los carruseles se dibujan enteros, sin comparar con la versión anterior:
      # son doce láminas, no veintidós tarjetas de medio mega, y el diff por
      # bloques del generador de historias no aplica a un archivo con tres
      # arreglos distintos. Si crece, se le pone diff.
      - name: Dibujar los carruseles
        id: carruseles
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-carruseles.mjs

      - name: Guardar los PNG en la rama
        # `always()` a propósito: render-stories.mjs sale con 1 si ALGUNA
        # tarjeta falla, aunque las otras veinte se hayan dibujado bien. Sin
        # esto el paso se saltaba y se tiraba todo el trabajo bueno — por eso
        # main lleva desde el 21 de octubre sin un solo PNG. Ahora se guarda lo
        # que salió y la corrida sigue marcada en rojo por lo que no salió.
        if: always() && steps.dibujar.outcome != 'skipped'
        run: |
          # `public/artes/` está en .gitignore para que las pruebas locales no
          # ensucien el árbol. Aquí sí se guardan a propósito, de ahí el -f.
          git add -f public/artes/stories-v2/ public/artes/carruseles/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No cambió ningún PNG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] no hace falta: este empujón solo toca public/artes/, y el
          # disparador de arriba solo mira el generador. No se llama a sí mismo.
          git commit -q -m "Artes: redibujar las tarjetas que cambiaron"
          git push origin "HEAD:${{ github.ref_name }}"
