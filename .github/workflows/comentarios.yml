# Lee los comentarios nuevos de Instagram y se los pasa a Homie, sin que nadie
# tenga que avisar.
#
# Hasta hoy Musa contestaba comentarios, pero solo los que Nicolle le pasaba a
# mano. Eso funcionaba y tenía una virtud escondida: ella era el filtro, así que
# lo que no debía contestarse nunca le llegaba. Este barrido quita ese paso, y
# por eso NO se enciende solo: la regla de a cuáles se contesta y a cuáles no
# está en la skill `responder-comentarios-redes`, y tiene que estar cargada en
# Homie antes de que esto corra de verdad.
#
# Por qué un barrido y no un webhook de Meta: un webhook obliga a exponer un
# endpoint público, pasar el `hub.challenge` y validar la firma de cada evento.
# Un comentario no necesita llegar en segundos. Esto es superficie de ataque
# cero y el mismo patrón que `dashboard-semanal.yml`, que ya lleva semanas
# corriendo.

name: Barrido de comentarios

on:
  # Dos veces al día: 9:30 AM y 3:30 PM de Puerto Rico (AST = UTC-4 todo el
  # año, sin horario de verano), de lunes a viernes.
  #
  # Empezó siendo cada 30 minutos y no funcionó: GitHub descarta corridas
  # programadas cuando hay carga, y los `*/30` son los primeros que tira. De
  # seis corridas que tocaban la tarde del 23 de noviembre salió UNA, y con
  # cinco horas de retraso. Un barrido que dice correr cada media hora y
  # corre una vez por noche es peor que uno que dice correr dos veces al día
  # y las cumple: el primero hace creer que no hay comentarios nuevos.
  #
  # Dos horas fijas también encajan con quien atiende lo que el barrido
  # levanta: a media mañana y a media tarde hay alguien para contestar.
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 19 * * 1-5"

  # A mano, para probarlo sin esperar a la media hora.
  workflow_dispatch:

permissions:
  contents: write

# Dos corridas a la vez se pisarían el registro y anunciarían dos veces el
# mismo comentario. Una cada vez, y la segunda espera.
concurrency:
  group: comentarios
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el entorno
        run: |
          if [ -z "${META_TOKEN}" ]; then
            echo "Falta el secret META_TOKEN del repositorio."
            exit 1
          fi
          echo "META_TOKEN presente (longitud ${#META_TOKEN})"
          if [ -z "${HOMIE_COMENTARIOS_WEBHOOK}" ]; then
            echo "Aviso: sin HOMIE_COMENTARIOS_WEBHOOK el barrido corre y deja el log,"
            echo "pero no avisa a nadie. Se pone en Settings > Secrets > Actions."
          fi
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          HOMIE_COMENTARIOS_WEBHOOK: ${{ secrets.HOMIE_COMENTARIOS_WEBHOOK }}

      # El diagnóstico primero: si el token caducó, el log lo dice en una línea
      # en vez de dejar un barrido vacío que parece «no hay comentarios nuevos».
      # Esa confusión es justo la que haría que una reclamación se quedara sola
      # en un post durante días sin que nadie se enterara.
      - name: Diagnóstico del token
        run: python3 scripts/meta-datos.py diagnostico
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      - name: Mirar los comentarios
        run: python3 scripts/meta-datos.py comentarios
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          HOMIE_COMENTARIOS_WEBHOOK: ${{ secrets.HOMIE_COMENTARIOS_WEBHOOK }}

      # El registro NO se vacía nunca: es lo único que distingue «comentario
      # nuevo» de «el de siempre». Borrarlo hace que el historial entero se
      # vuelva a anunciar como nuevo y que nadie vuelva a leer un aviso.
      - name: Guardar el registro
        run: |
          # Se añade ANTES de comparar. `git diff` a secas no ve un archivo nuevo
          # sin rastrear, así que la primera corrida decía «sin cambios», salía en
          # verde y no guardaba nada — y la siguiente volvía a anunciar los mismos
          # comentarios como nuevos. Pasó en la corrida #2.
          git add -A public/data/comentarios-vistos.json
          if git diff --cached --quiet -- public/data/comentarios-vistos.json; then
            echo "Sin comentarios nuevos: el registro no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Barrido de comentarios — $(date -u '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main || {
            echo "El push chocó, reintento tras traer lo del remoto"
            git pull --rebase origin main
            git push origin HEAD:main
          }
