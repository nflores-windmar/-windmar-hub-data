<head>

<title>WindMar · Todo bajo un mismo techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#14476e; --blue:#2b7bb9; --blue2:#4aa3d6;
    --paper:#ffffff; --orange:#f57c0a; --orange-ink:#c9600a;
    --grid:rgba(43,123,185,.13);
    --bg:#eaf2fa;

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
  .bar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:center;
       padding:12px;background:#fff;border-bottom:1px solid #d9e6f3;flex-wrap:wrap}
  .bar h1{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px;margin:0;color:var(--ink);text-transform:uppercase}
  .bar button{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px;cursor:pointer;
       border:none;background:var(--orange);color:#fff;padding:10px 18px;border-radius:8px}
  .bar button:active{transform:translateY(1px)}
  .bar .muted{font-size:12px;color:#6f8aa3}
  #stageWrap{display:flex;justify-content:center;padding:12px}
  #stage{transform-origin:top center}
  #flyer{width:1080px;height:1350px;background:var(--paper);position:relative;overflow:hidden}
  .t-kick{font-family:'DM Mono',monospace;font-weight:500}
  .t-head{font-family:'Anek Latin',sans-serif;font-weight:800}
  .t-sub{font-family:'DM Sans',sans-serif;font-weight:500}
  .z-kick{font-family:'DM Mono',monospace;font-weight:500}
  .z-num{font-family:'Anek Latin',sans-serif;font-weight:800}
  .z-lab{font-family:'DM Sans',sans-serif;font-weight:600}
  .card-t{font-family:'DM Mono',monospace;font-weight:500}
  .card-b{font-family:'DM Sans',sans-serif;font-weight:500}
  .foot{font-family:'DM Mono',monospace;font-weight:500}
</style>
</head>

<script type="module">
  import { toPng } from 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm';

  function fit(){
    const s=Math.min(1,(window.innerWidth-24)/1080);
    document.getElementById('stage').style.transform='scale('+s+')';
    document.getElementById('stageWrap').style.height=(1350*s+24)+'px';
  }
  window.addEventListener('resize',fit); fit();

  let __embedCSS=null;
  function buf2b64(buf){const b=new Uint8Array(buf);let s='';const c=0x8000;for(let i=0;i<b.length;i+=c){s+=String.fromCharCode.apply(null,b.subarray(i,i+c));}return btoa(s);}
  async function getEmbedCSS(){
    if(__embedCSS!=null) return __embedCSS;
    try{
      const links=[...document.querySelectorAll('link[href*="fonts.googleapis.com/css"]')].map(l=>l.href);
      let out='';
      for(const href of links){
        let css=await (await fetch(href)).text();
        const urls=[...new Set([...css.matchAll(/url\((https:\/\/fonts\.gstatic\.com[^)]+)\)/g)].map(m=>m[1]))];
        for(const u of urls){ try{ const b=await (await fetch(u)).arrayBuffer(); css=css.split(u).join('data:font/woff2;base64,'+buf2b64(b)); }catch(e){} }
        out+=css+'\n';
      }
      __embedCSS=out;
    }catch(e){ __embedCSS=''; }
    return __embedCSS;
  }

  document.getElementById('dl').addEventListener('click',async(e)=>{
    const btn=e.currentTarget; const old=btn.textContent; btn.textContent='Generando…'; btn.disabled=true;
    try{
      const node=document.getElementById('flyer');
      const fontEmbedCSS=await getEmbedCSS();
      await document.fonts.ready;
      const dataUrl=await toPng(node,{width:1080,height:1350,pixelRatio:2,cacheBust:true,fontEmbedCSS});
      const a=document.createElement('a'); a.href=dataUrl; a.download='windmar-todo-bajo-un-techo.png'; a.click();
    }catch(err){ alert('Error al generar PNG: '+err); }
    finally{ btn.textContent=old; btn.disabled=false; }
  });
</script>
</body>
</html>
