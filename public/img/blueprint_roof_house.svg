<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- blueprint guide lines -->
  <g stroke="#c9dcf5" stroke-width="1" opacity="0.7">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>
  <!-- ground -->
  <line x1="90" y1="500" x2="710" y2="500" stroke="#1a52c7" stroke-width="4" stroke-linecap="round"/>
  <!-- house body -->
  <rect x="200" y="300" width="400" height="200" fill="#ffffff" stroke="#1a52c7" stroke-width="4"/>
  <!-- door -->
  <rect x="360" y="380" width="80" height="120" fill="#ffffff" stroke="#1a52c7" stroke-width="3"/>
  <!-- window -->
  <rect x="250" y="350" width="70" height="60" fill="#ffffff" stroke="#1a52c7" stroke-width="3"/>
  <rect x="480" y="350" width="70" height="60" fill="#ffffff" stroke="#1a52c7" stroke-width="3"/>
  <!-- roof (highlighted, the focus) -->
  <path d="M160 300 L400 150 L640 300 Z" fill="#eaf2fd" stroke="#1a52c7" stroke-width="5" stroke-linejoin="round"/>
  <!-- roof sealing coat line (accent) -->
  <path d="M172 293 L400 150 L628 293" fill="none" stroke="#f57c0a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <!-- roof texture lines -->
  <g stroke="#7eb8f7" stroke-width="2" opacity="0.8">
    <line x1="240" y1="250" x2="290" y2="250"/>
    <line x1="330" y1="215" x2="380" y2="215"/>
    <line x1="440" y1="215" x2="490" y2="215"/>
    <line x1="520" y1="250" x2="570" y2="250"/>
  </g>
  <!-- dimension arrows on roof -->
  <g stroke="#1a52c7" stroke-width="1.5" opacity="0.5">
    <line x1="160" y1="315" x2="640" y2="315"/>
    <path d="M160 315 l10 -5 l0 10 z" fill="#1a52c7"/>
    <path d="M640 315 l-10 -5 l0 10 z" fill="#1a52c7"/>
  </g>
</svg>
