<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WindMar · Drone shot — Todo bajo un mismo techo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14476e; --blue:#2b7bb9; --blue2:#4aa3d6;
    --paper:#ffffff; --orange:#f57c0a; --orange-ink:#c9600a;
    --grid:rgba(43,123,185,.13); --bg:#eaf2fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);font-family:'Montserrat',system-ui,sans-serif;color:var(--ink)}
  .bar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:center;
       padding:12px;background:#fff;border-bottom:1px solid #d9e6f3;flex-wrap:wrap}
  .bar h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;margin:0;color:var(--ink);text-transform:uppercase}
  .bar button,.bar label{font-family:'Montserrat',sans-serif;font-weight:600;font-size:13px;letter-spacing:1px;cursor:pointer;
       border:none;padding:10px 18px;border-radius:8px}
  .bar label{background:#dcebf7;color:var(--ink)}
  .bar button{background:var(--orange);color:#fff}
  .bar button:active{transform:translateY(1px)}
  .bar input[type=file]{display:none}
  #stageWrap{display:flex;justify-content:center;padding:12px}
  #stage{transform-origin:top center}
  #flyer{width:1080px;height:1350px;background:var(--paper);position:relative;overflow:hidden}
</style>
</head>
<body>
  <div class="bar">
    <h1>Drone shot · Todo bajo un mismo techo</h1>
    <label for="imgin">🖼 Cargar drone shot</label>
    <input id="imgin" type="file" accept="image/*">
    <button id="dl">⬇︎ Descargar PNG</button>
    <span style="font-size:12px;color:#6f8aa3">1080×1350 · 4:5</span>
  </div>
  <div id="stageWrap"><div id="stage">
  <div id="flyer">
    <svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
        <clipPath id="heroClip"><rect x="0" y="0" width="1080" height="1350"/></clipPath>
        <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="botScrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
        </linearGradient>
      </defs>

      <!-- paper -->
      <rect x="0" y="0" width="1080" height="1350" fill="#ffffff"/>

      <!-- ===== HERO (drone shot) — full image, contained ===== -->
      <g clip-path="url(#heroClip)">
        <rect x="0" y="0" width="1080" height="1350" fill="#f4f8fc"/>
        <rect x="0" y="0" width="1080" height="1350" fill="url(#grid)"/>
        <image id="hero" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid meet" href="img/techo-drone.png"/>
        <!-- placeholder when empty -->
        <g id="ph" style="display:none">
          <rect x="60" y="60" width="960" height="1230" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-dasharray="10 10" rx="14"/>
          <text x="540" y="660" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="var(--blue)">CARGA TU DRONE SHOT AQUÍ</text>
          <text x="540" y="702" text-anchor="middle" font-family="'Montserrat',sans-serif" font-size="20" fill="#6f8aa3">Ilustración aérea del techo · estilo blueprint</text>
        </g>
        <!-- white scrims so title/footer stay legible -->
        <rect x="0" y="0" width="1080" height="250" fill="url(#topScrim)"/>
        <rect x="0" y="1110" width="1080" height="170" fill="url(#botScrim)"/>
        <rect x="0" y="1278" width="1080" height="72" fill="#ffffff"/>
      </g>

      <!-- ===== TITLE ===== -->
      <text x="60" y="84" font-family="'Montserrat',sans-serif" font-weight="700" font-size="19" letter-spacing="4" fill="var(--blue)">WINDMAR HOME · PUERTO RICO</text>
      <text x="56" y="170" font-family="'Bebas Neue',sans-serif" font-size="86" letter-spacing="1" fill="var(--ink)">TODO BAJO UN MISMO <tspan fill="var(--orange)">TECHO</tspan></text>
      <text x="60" y="212" font-family="'Montserrat',sans-serif" font-weight="500" font-size="22" fill="#3d6588">Solar, roofing y filtración de agua — todo tu hogar, con un solo equipo.</text>

      <!-- ===== CHIPS · brand pills (icons per category) ===== -->
      <g font-family="'Montserrat',sans-serif" font-weight="700" font-size="22" letter-spacing="1">
        <!-- Solar -->
        <rect x="60" y="1150" width="150" height="44" rx="22" fill="#0a2882"/>
        <g transform="translate(80,1160) scale(1.3)" fill="none" stroke="#f5b301" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
          <path d="M1 13 L5.5 4 H15 L12.5 13 Z"/>
          <path d="M4.4 13 L7.2 4 M7.7 13 L10 4 M11 13 L12.9 4"/>
          <path d="M1 9 H13.7"/>
          <path d="M7 13 V16.5 M4.3 16.5 H9.7"/>
        </g>
        <text x="112" y="1181" fill="#ffffff">SOLAR</text>
        <!-- Roofing -->
        <rect x="226" y="1150" width="170" height="44" rx="22" fill="#0a2882"/>
        <circle cx="252" cy="1172" r="7" fill="#6fb3e8"/>
        <text x="272" y="1181" fill="#ffffff">ROOFING</text>
        <!-- Water -->
        <rect x="412" y="1150" width="316" height="44" rx="22" fill="#0a2882"/>
        <g transform="translate(432,1162) scale(1.3)" stroke="#a9d6f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path fill="none" d="M1 8 H8"/>
          <path fill="none" d="M8 8 V4 H12"/>
          <path fill="none" d="M10 2 H14.5"/>
          <path fill="none" d="M12 8 H16 V11 H14"/>
          <path fill="#a9d6f2" stroke="none" d="M14 13 c1 1.3 1 2.4 0 2.6 c-1 -0.2 -1 -1.3 0 -2.6 Z"/>
        </g>
        <text x="470" y="1181" fill="#ffffff">FILTRACIÓN DE AGUA</text>
      </g>

      <!-- ===== FOOTER ===== -->
      <line x1="60" y1="1250" x2="1020" y2="1250" stroke="var(--orange)" stroke-width="3"/>
      <text x="60" y="1304" font-family="'Bebas Neue',sans-serif" font-size="42" letter-spacing="2" fill="var(--ink)">VISITA WINDMAR.COM</text>
      <text x="1020" y="1301" text-anchor="end" font-family="'Montserrat',sans-serif" font-weight="600" font-size="19" fill="var(--orange-ink)">Evaluación gratis · sin compromiso</text>
    </svg>
  </div>
  </div></div>

<script type="module">
  import { toPng } from 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm';

  function fit(){
    const s=Math.min(1,(window.innerWidth-24)/1080);
    document.getElementById('stage').style.transform='scale('+s+')';
    document.getElementById('stageWrap').style.height=(1350*s+24)+'px';
  }
  window.addEventListener('resize',fit); fit();

  const hero=document.getElementById('hero'), ph=document.getElementById('ph');
  function loadFile(file){
    if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ hero.setAttribute('href', r.result); ph.style.display='none'; };
    r.readAsDataURL(file);
  }
  document.getElementById('imgin').addEventListener('change',e=>loadFile(e.target.files[0]));
  const flyer=document.getElementById('flyer');
  flyer.addEventListener('dragover',e=>e.preventDefault());
  flyer.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0]);});

  let __embedCSS=null;
  function buf2b64(buf){const b=new Uint8Array(buf);let s='';const c=0x8000;for(let i=0;i<b.length;i+=c){s+=String.fromCharCode.apply(null,b.subarray(i,i+c));}return btoa(s);}
  async function getEmbedCSS(){
    if(__embedCSS!=null) return __embedCSS;
    try{
      const links=[...document.querySelectorAll('link[href*="fonts.googleapis.com/css"]')].map(l=>l.href);
      let out='';
      for(const href of links){
        let css=await (await fetch(href)).text();
        const urls=[...new Set([...css.matchAll(/url\((https:\/\/fonts\.gstatic\.com[^)]+)\)/g)].map(m=>m[1]))];
        for(const u of urls){ try{ const b=await (await fetch(u)).arrayBuffer(); css=css.split(u).join('data:font/woff2;base64,'+buf2b64(b)); }catch(e){} }
        out+=css+'\n';
      }
      __embedCSS=out;
    }catch(e){ __embedCSS=''; }
    return __embedCSS;
  }

  document.getElementById('dl').addEventListener('click',async(e)=>{
    const btn=e.currentTarget; const old=btn.textContent; btn.textContent='Generando…'; btn.disabled=true;
    try{
      const node=document.getElementById('flyer');
      const fontEmbedCSS=await getEmbedCSS();
      await document.fonts.ready;
      const dataUrl=await toPng(node,{width:1080,height:1350,pixelRatio:2,cacheBust:true,fontEmbedCSS});
      const a=document.createElement('a'); a.href=dataUrl; a.download='windmar-techo-drone.png'; a.click();
    }catch(err){ alert('Error al generar PNG: '+err); }
    finally{ btn.textContent=old; btn.disabled=false; }
  });
</script>
</body>
</html>
