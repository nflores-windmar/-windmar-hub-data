    color: rgba(255,255,255,0.25);

    letter-spacing: 0.14em;

  }
  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    box-shadow:
      0 0 0 1px rgba(26,82,199,0.3),

    <stop offset="100%" stop-color="#050d1a"/>

    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fOrange" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="drop">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
  </filter>
